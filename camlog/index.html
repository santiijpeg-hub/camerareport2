<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Cámara</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cam Log">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__mark">
    <div class="clapper" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <div class="topbar__title">
    <h1>Registro de cámara</h1>
    <p id="todayLabel" class="topbar__date"></p>
  </div>
  <div class="topbar__count">
    <span id="countNumber">0</span>
    <small>tomas</small>
  </div>
</header>

<main>

  <section class="panel entry-panel" aria-labelledby="entryHeading">
    <h2 id="entryHeading" class="panel__label">Nueva toma</h2>

    <form id="entryForm" autocomplete="off">
      <div class="field-row">
        <label class="field">
          <span>Escena / Setup</span>
          <input type="text" id="f_scene" placeholder="12A" required>
        </label>
        <label class="field field--narrow">
          <span>Toma</span>
          <input type="text" id="f_take" inputmode="numeric" placeholder="1" required>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Lente</span>
          <input type="text" id="f_lens" placeholder="35mm">
        </label>
        <label class="field">
          <span>Filtro</span>
          <input type="text" id="f_filter" placeholder="ND 0.6">
        </label>
      </div>

      <label class="field">
        <span>Notas</span>
        <textarea id="f_note" rows="2" placeholder="Detalles de la toma, encuadre, incidencias…"></textarea>
      </label>

      <div class="field-row field-row--actions">
        <button type="button" id="goodToggle" class="good-toggle" aria-pressed="false">
          <span class="good-toggle__ring" aria-hidden="true"></span>
          Toma buena
        </button>
        <button type="submit" class="btn-primary">Guardar toma</button>
      </div>
    </form>
  </section>

  <section class="panel log-panel" aria-labelledby="logHeading">
    <div class="log-panel__header">
      <h2 id="logHeading" class="panel__label">Registro</h2>
      <button id="clearAll" class="btn-ghost" type="button">Borrar todo</button>
    </div>

    <div id="logList" class="log-list">
      <p id="emptyState" class="empty-state">Todavía no has registrado ninguna toma. Usa el formulario de arriba para empezar.</p>
    </div>
  </section>

</main>

<div class="dock">
  <button id="exportPdf" class="btn-export" type="button">
    Exportar PDF
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
